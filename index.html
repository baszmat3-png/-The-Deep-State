<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<title>دليل الأرقام</title>
<style>
:root{--a:#0d9488;--a2:#6366f1;--aT:#fff;--bg:#f2f5fa;--bgx:none;--c:#fff;--c2:#f6f8fc;--t:#0f172a;--m:#64748b;--l:#e3e8f0;--sh:0 1px 2px rgba(15,23,42,.04),0 10px 30px -12px rgba(15,23,42,.14);--r:20px;--wa:#22c55e;--ok:#16a34a;--er:#ef4444;--wn:#d97706;--bl:#0ea5e9;--hero:linear-gradient(135deg,#0d9488,#4f46e5);--hT:#fff;--ibg:rgba(255,255,255,.18);--bub:#d9fdd3;--bubt:#111b21;--pg:linear-gradient(135deg,var(--a),var(--a2));--ff:'Tajawal','Segoe UI',Tahoma,'Noto Naskh Arabic',Arial,sans-serif}
[data-tm=night]{--a:#2dd4bf;--a2:#818cf8;--aT:#04201c;--bg:#080d1a;--c:#101730;--c2:#0b1124;--t:#e8ecf8;--m:#8e9abb;--l:#212b4a;--sh:0 1px 0 rgba(255,255,255,.04) inset,0 14px 34px -14px rgba(0,0,0,.7);--hero:linear-gradient(135deg,#0f766e,#312e81 70%,#1e1b4b);--ibg:rgba(255,255,255,.12);--bub:#005c4b;--bubt:#e9edef;--ok:#4ade80;--wn:#fbbf24;--er:#f87171;color-scheme:dark}
[data-tm=royal]{--a:#d4af37;--a2:#a8821a;--aT:#1a1405;--bg:#0b0a07;--c:#15120b;--c2:#100e08;--t:#f5ecd3;--m:#a89c7c;--l:#2d2615;--sh:0 14px 34px -14px rgba(0,0,0,.8);--hero:linear-gradient(135deg,#17120a,#3a2c0b 55%,#8a6a16);--hT:#fff3cf;--ibg:rgba(212,175,55,.18);--pg:linear-gradient(135deg,#f3d77a,#d4af37 45%,#a8821a);--bub:#3b3213;--bubt:#f5ecd3;--ok:#86efac;--wn:#fbbf24;--er:#fca5a5;color-scheme:dark}
[data-tm=ocean]{--a:#38bdf8;--a2:#6366f1;--aT:#03121f;--bg:#050e1a;--c:#0b1b30;--c2:#081525;--t:#e3f0fb;--m:#86a0ba;--l:#17304d;--sh:0 14px 34px -14px rgba(0,0,0,.75);--hero:linear-gradient(135deg,#0369a1,#1d4ed8 55%,#312e81);--ibg:rgba(255,255,255,.13);--bub:#0b4f66;--bubt:#e6f6ff;--ok:#4ade80;--wn:#fbbf24;--er:#f87171;color-scheme:dark}
[data-tm=glass]{--a:#7c3aed;--a2:#ec4899;--aT:#fff;--bg:#e8ecff;--bgx:radial-gradient(48rem 34rem at 95% -8%,#fbcfe8,transparent 60%),radial-gradient(44rem 34rem at -8% 8%,#a5f3fc,transparent 58%),radial-gradient(46rem 36rem at 55% 110%,#c7d2fe,transparent 62%);--c:rgba(255,255,255,.62);--c2:rgba(255,255,255,.5);--t:#1e1b4b;--m:#5b5f86;--l:rgba(255,255,255,.75);--sh:0 10px 34px rgba(76,29,149,.14);--hero:linear-gradient(135deg,rgba(124,58,237,.9),rgba(236,72,153,.86))}
[data-tm=forest]{--a:#16a34a;--a2:#0f766e;--bg:#eef4ec;--c:#fff;--c2:#f4f9f2;--t:#10241a;--m:#5f7468;--l:#dbe7d8;--hero:linear-gradient(135deg,#14532d,#166534 50%,#0f766e)}
[data-tm=sunset]{--a:#ea580c;--a2:#db2777;--bg:#fff6ee;--c2:#fff9f4;--t:#2a1308;--m:#8a6a58;--l:#f6dfcf;--hero:linear-gradient(135deg,#f97316,#e11d48 70%,#9d174d)}
[data-tm=ink]{--a:#111827;--a2:#374151;--aT:#fff;--bg:#f7f6f2;--c:#fff;--c2:#faf9f6;--t:#111827;--m:#6b7280;--l:#e3e0d6;--r:10px;--sh:none;--hero:var(--bg);--hT:#111827;--ibg:#fff;--pg:#111827;--bub:#e7ffdb}
[data-tm=ink] .hero{border-bottom:2px solid #111827;padding-bottom:72px}[data-tm=ink] .ib{border:1px solid var(--l)}[data-tm=ink] .card{border-width:1.5px}[data-tm=ink] .av{border-radius:8px}
[data-tm=royal] .card,[data-tm=ink] .card{--cc:var(--a)!important}[data-tm=royal] .av,[data-tm=ink] .av{background-color:var(--a)!important;color:var(--aT)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background-color:var(--bg);background-image:var(--bgx);background-attachment:fixed;color:var(--t);font:15px/1.55 var(--ff);font-size:calc(15px*var(--fs,1));transition:background-color .3s,color .3s}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,input,select,textarea{font:inherit;color:inherit}
[data-tm=glass] :is(.card,.sb,.chip,.sh,.lc,.tile,.tabs,.cm,.ur,.chat){-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5)}
.hero{position:relative;overflow:hidden;background:var(--hero);color:var(--hT);padding:calc(20px + env(safe-area-inset-top)) 16px 72px}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.1);pointer-events:none}.hero:before{width:260px;height:260px;top:-110px;inset-inline-end:-60px}.hero:after{width:170px;height:170px;bottom:-90px;inset-inline-start:8%}
[data-tm=ink] .hero:before,[data-tm=ink] .hero:after{display:none}
.top{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:900px;margin:auto}
h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.2px}.sub{opacity:.88;font-size:13px;margin-top:3px}
.hb{display:flex;gap:8px}
.ib{width:44px;height:44px;border-radius:15px;border:0;background:var(--ibg);color:var(--hT);display:grid;place-items:center;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:transform .15s}.ib:active{transform:scale(.93)}
.sw{max-width:900px;margin:-46px auto 0;padding:0 14px;position:sticky;top:8px;z-index:9}
.sb{display:flex;align-items:center;gap:10px;background:var(--c);border-radius:18px;padding:0 16px;box-shadow:var(--sh);border:1px solid var(--l);transition:box-shadow .2s,border-color .2s}.sb:focus-within{border-color:var(--a);box-shadow:0 0 0 4px color-mix(in srgb,var(--a) 18%,transparent)}
.sb svg{color:var(--m)}.sb input{flex:1;border:0;background:none;padding:15px 0;outline:0;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--l);background:var(--c);border-radius:999px;padding:7px 15px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;box-shadow:var(--sh);transition:all .15s}
.chip b{color:var(--m);margin-inline-start:6px;font-weight:500}.chip.on{background:var(--pg);border-color:transparent;color:var(--aT)}.chip.on b{color:inherit;opacity:.8}
main{max-width:900px;margin:auto;padding:4px 14px 120px}
.bn{display:flex;justify-content:space-between;align-items:center;gap:12px;background:color-mix(in srgb,var(--wn) 14%,var(--c));border:1px solid color-mix(in srgb,var(--wn) 40%,transparent);color:var(--t);border-radius:16px;padding:11px 14px;margin:8px 0;font-size:14px}
.bn button{background:var(--pg);border:0;color:var(--aT);border-radius:11px;padding:8px 16px;font-weight:700;cursor:pointer}
.bn.run{background:color-mix(in srgb,var(--a) 10%,var(--c));border-color:color-mix(in srgb,var(--a) 35%,transparent)}.bn.run>div{flex:1;min-width:0}
h2{font-size:14px;margin:24px 4px 11px;display:flex;align-items:center;gap:8px;color:var(--m);font-weight:700}h2 span{background:var(--c);border:1px solid var(--l);border-radius:999px;padding:0 9px;font-size:12px}h2 i{flex:1;height:1px;background:var(--l)}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr))}
.card{position:relative;background:var(--c);border:1px solid var(--l);border-radius:var(--r);padding:15px;box-shadow:var(--sh);overflow:hidden;transition:transform .18s,box-shadow .18s}
.card:before{content:"";position:absolute;inset-block:14px;inset-inline-start:0;width:3px;border-radius:0 3px 3px 0;background:var(--cc,var(--a));opacity:.9}
@media(hover:hover){.card:hover{transform:translateY(-2px)}}
.cp .card{padding:10px 13px}
.r1{display:flex;gap:13px;align-items:center}
.av{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:19px;flex:none;background-image:linear-gradient(135deg,rgba(255,255,255,.3),rgba(0,0,0,.14));box-shadow:0 6px 14px -6px var(--cc,var(--a))}
.nm{font-weight:700;line-height:1.35}.tt{color:var(--m);font-size:13px;margin-top:2px}.tag{display:inline-block;font-size:11px;background:var(--c2);border:1px solid var(--l);color:var(--m);border-radius:8px;padding:1px 8px;margin:5px 0 0 4px}
.r2{display:flex;flex-direction:column;gap:11px;margin-top:13px}
.num{direction:ltr;unicode-bidi:embed;text-align:right;white-space:nowrap;font-size:1.14em;font-weight:800;letter-spacing:.5px;font-variant-numeric:tabular-nums;color:var(--a)}
.ac{display:flex;gap:6px}.ac .b{flex:1;justify-content:center}.ac .b.s{flex:0 0 42px}
.b{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 13px;border-radius:13px;border:1px solid var(--l);background:var(--c2);text-decoration:none;color:var(--t);cursor:pointer;font-weight:700;font-size:13px;transition:all .15s}.b:active{transform:scale(.96)}
.b:disabled{opacity:.5}
.fv{font-size:19px;line-height:1}.fv.on{color:#f59e0b;border-color:#f59e0b;background:color-mix(in srgb,#f59e0b 12%,var(--c2))}
.b.wa{background:linear-gradient(135deg,#25d366,#128c7e);border-color:transparent;color:#fff}.b.s{width:40px;padding:0;justify-content:center}
.fab{position:fixed;inset-inline-start:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:21px;border:0;background:var(--pg);color:var(--aT);box-shadow:0 14px 30px -8px color-mix(in srgb,var(--a) 70%,#000);display:grid;place-items:center;cursor:pointer;z-index:20;transition:transform .15s}.fab:active{transform:scale(.92)}.fab svg{width:26px;height:26px}
.ov{position:fixed;inset:0;background:rgba(2,6,23,.58);display:none;align-items:flex-end;justify-content:center;z-index:50;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}.ov.on{display:flex}
.sh{position:relative;background:var(--c);border:1px solid var(--l);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));animation:up .26s cubic-bezier(.2,.9,.3,1)}.sh.wide{max-width:780px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(min-width:600px){.ov{align-items:center}.sh{border-radius:26px}}
.sh h3{margin:0 0 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:18px;font-weight:800}
label{display:block;font-size:13px;font-weight:600;color:var(--m);margin:14px 0 6px}
.f{width:100%;padding:12px 14px;border-radius:13px;border:1px solid var(--l);background:var(--c2);outline:0;font-size:16px;transition:border-color .15s,box-shadow .15s}.f:focus{border-color:var(--a);box-shadow:0 0 0 4px color-mix(in srgb,var(--a) 16%,transparent)}
textarea.f{resize:vertical;line-height:1.6}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{flex:1;min-width:70px;padding:10px;border-radius:13px;border:1px solid var(--l);background:var(--c2);cursor:pointer;font-weight:600;transition:all .15s}.seg button.on{background:var(--pg);border-color:transparent;color:var(--aT)}
.sw2{display:flex;gap:10px;flex-wrap:wrap}.sw2 button{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer;outline:2px solid var(--l)}.sw2 button.on{border-color:var(--c);outline-color:var(--t)}
.pr{display:block;background:var(--pg);color:var(--aT);border:0;border-radius:15px;padding:14px;width:100%;font-weight:800;margin-top:14px;cursor:pointer;box-shadow:0 10px 22px -12px color-mix(in srgb,var(--a) 80%,#000);transition:transform .15s,opacity .15s}.pr:active{transform:scale(.98)}.pr:disabled{opacity:.55}
.dg{background:transparent;color:var(--er);border:1px solid var(--er);box-shadow:none}
.sec{margin:18px 0 0;padding-top:4px;border-top:1px solid var(--l)}
.ur{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 13px;background:var(--c2);border:1px solid var(--l);border-radius:14px;margin-bottom:8px}
.chks{max-height:210px;overflow:auto;background:var(--c2);border:1px solid var(--l);border-radius:14px;padding:4px 13px}
label.chk{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;color:var(--t);margin:0;padding:8px 0}
label.chk input{width:18px;height:18px;accent-color:var(--a)}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(10px);background:#0f172a;color:#fff;padding:11px 20px;border-radius:14px;opacity:0;transition:.25s;z-index:99;pointer-events:none;font-size:14px;max-width:90vw;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.35)}.toast.on{opacity:1;transform:translateX(-50%)}
.emp{text-align:center;color:var(--m);padding:56px 12px}
#lg{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:var(--hero);overflow:auto}
#lg:before{content:"";position:absolute;inset:0;background:radial-gradient(40rem 30rem at 85% 0,rgba(255,255,255,.18),transparent 60%),radial-gradient(34rem 26rem at 0 100%,rgba(0,0,0,.25),transparent 60%)}
[data-tm=ink] #lg{background:var(--bg)}
.lc{position:relative;width:100%;max-width:390px;background:var(--c);border:1px solid var(--l);border-radius:28px;padding:30px 24px;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);text-align:center}
.lc h1{font-size:23px}.lc .lo{width:68px;height:68px;margin:0 auto 14px;border-radius:22px;background:var(--pg);display:grid;place-items:center;font-size:32px;box-shadow:0 14px 28px -10px color-mix(in srgb,var(--a) 75%,#000)}.lc p{color:var(--m);margin:4px 0 8px}.lc label{text-align:right}
.er{color:var(--er);font-size:13px;min-height:20px;margin-top:10px}
/* ثيمات الإعدادات */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.th{border:2px solid var(--l);background:var(--c2);border-radius:16px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:7px;align-items:center;font-size:12px;font-weight:700;transition:all .15s}
.th i{display:block;width:100%;height:38px;border-radius:10px;background:var(--g);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}.th.on{border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 22%,transparent)}
/* مركز واتساب */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:700;background:var(--c2);color:var(--m);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}.pill.er{background:color-mix(in srgb,var(--er) 14%,transparent);color:var(--er)}.pill.wn{background:color-mix(in srgb,var(--wn) 16%,transparent);color:var(--wn)}.pill.bl{background:color-mix(in srgb,var(--bl) 16%,transparent);color:var(--bl)}.pill.run{background:color-mix(in srgb,var(--a) 15%,transparent);color:var(--a)}
.h3s{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.h3s .pill{font-size:11px}
.tabs{display:flex;gap:4px;background:var(--c2);padding:4px;border-radius:16px;border:1px solid var(--l);margin-bottom:6px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:none;padding:8px 4px;border-radius:12px;cursor:pointer;font-weight:700;font-size:12px;white-space:nowrap;color:var(--m);transition:all .15s}.tabs button i{font-style:normal;font-size:18px;line-height:1.2}.tabs button.on{background:var(--pg);color:var(--aT);box-shadow:0 6px 14px -8px color-mix(in srgb,var(--a) 80%,#000)}
.note{background:color-mix(in srgb,var(--a) 9%,var(--c));border:1px solid color-mix(in srgb,var(--a) 28%,transparent);border-radius:14px;padding:11px 13px;font-size:13px;margin:12px 0 0;line-height:1.7}.note.er{background:color-mix(in srgb,var(--er) 10%,var(--c));border-color:color-mix(in srgb,var(--er) 35%,transparent)}.note a{color:var(--a);font-weight:700}
.vars{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.vars button{border:1px dashed var(--a);background:color-mix(in srgb,var(--a) 8%,transparent);color:var(--a);border-radius:11px;padding:6px 11px;font-size:13px;cursor:pointer;font-weight:700}
.chat{background:var(--c2);background-image:radial-gradient(circle at 20% 20%,color-mix(in srgb,var(--a) 7%,transparent),transparent 60%);border:1px solid var(--l);border-radius:16px;padding:14px}
.bub{background:var(--bub);color:var(--bubt);border-radius:14px 14px 4px 14px;padding:10px 13px;white-space:pre-wrap;word-break:break-word;max-width:92%;margin-inline-start:auto;box-shadow:0 1px 2px rgba(0,0,0,.12);line-height:1.65;font-size:14.5px;min-height:20px}
.sumbox{margin-top:12px;padding:11px 14px;border-radius:14px;background:color-mix(in srgb,var(--a) 10%,var(--c));border:1px solid color-mix(in srgb,var(--a) 26%,transparent);font-weight:700;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:9px;margin-top:14px}
.tile{background:var(--c2);border:1px solid var(--l);border-radius:16px;padding:12px 8px;text-align:center}.tile b{display:block;font-size:26px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}.tile span{font-size:12px;color:var(--m);font-weight:600}
.tile.ok b{color:var(--ok)}.tile.er b{color:var(--er)}.tile.bl b{color:var(--bl)}
.hd{display:flex;align-items:center;gap:16px;margin-top:4px}.hdi{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
.ring{--p:0;width:112px;height:112px;border-radius:50%;flex:none;background:conic-gradient(var(--a) calc(var(--p)*1%),var(--l) 0);display:grid;place-items:center;transition:background .5s}.ring i{width:88px;height:88px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:23px}
.pbar{height:8px;border-radius:99px;background:var(--l);overflow:hidden;margin:9px 0 7px}.pbar>i{display:block;height:100%;border-radius:99px;background:var(--pg);transition:width .5s}
.pbar.on>i{background-image:linear-gradient(135deg,rgba(255,255,255,.28) 25%,transparent 25% 50%,rgba(255,255,255,.28) 50% 75%,transparent 75%),var(--pg);background-size:18px 18px,100% 100%;animation:mv 1s linear infinite}@keyframes mv{to{background-position:18px 0,0 0}}
.cm{background:var(--c2);border:1px solid var(--l);border-radius:16px;padding:13px 14px;margin-top:10px;cursor:pointer;transition:border-color .15s,transform .15s}.cm:hover{border-color:var(--a)}
.cmh{display:flex;justify-content:space-between;align-items:center;gap:8px}.mini{display:flex;gap:12px;font-size:12.5px;font-weight:700;color:var(--m);flex-wrap:wrap}.mini .ok{color:var(--ok)}.mini .bl{color:var(--bl)}.mini .er{color:var(--er)}
.tpv{margin-top:7px;font-size:13px;color:var(--m);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.rl{max-height:340px;overflow:auto;border:1px solid var(--l);border-radius:16px;background:var(--c2)}

// ---- import parsers (csv / vcf / xlsx) ----
const digs=s=>String(s==null?'':s).replace(/\D/g,'');
const adig=s=>String(s==null?'':s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
const isPh=s=>{s=adig(s).trim();const d=s.replace(/\D/g,'');return d.length>=7&&d.length>=s.replace(/[\s()+\-.]/g,'').length*0.8};
function parseCSV(txt){txt=txt.replace(/^\uFEFF/,'');const first=txt.split('\n')[0]||'';const d=[',',';','\t'].map(x=>[x,first.split(x).length]).sort((a,b)=>b[1]-a[1])[0][0];
 const rows=[];let r=[],f='',q=false;
 for(let i=0;i<txt.length;i++){const ch=txt[i];
  if(q){if(ch=='"'){if(txt[i+1]=='"'){f+='"';i++}else q=false}else f+=ch}
  else if(ch=='"')q=true;
  else if(ch==d){r.push(f);f=''}
  else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&txt[i+1]=='\n')i++;r.push(f);f='';rows.push(r);r=[]}
  else f+=ch}
 if(f!==''||r.length){r.push(f);rows.push(r)}
 return rows.filter(x=>x.some(y=>String(y).trim()))}
function rowsToItems(rows){
 rows=rows.map(r=>r.map(x=>String(x==null?'':x).trim())).filter(r=>r.some(Boolean));
 if(!rows.length)return{items:[],skipped:0};
 const head=!rows[0].some(isPh);let cnl=[],cp=[],ct=-1,cc=-1,st=0;
 if(head){rows[0].forEach((h,i)=>{const x=h.toLowerCase();
   if(/phonetic|نطق/.test(x))return;
   if(/قسم|تصنيف|categor|group|label/.test(x))cc=cc<0?i:cc;
   else if(/رقم|هاتف|موبايل|جوال|phone|mobile|tel|number|cell/.test(x))cp.push(i);
   else if(/منصب|وظيف|title|company|organi|job|عمل|جهة/.test(x))ct=ct<0?i:ct;
   else if(/اسم|name/.test(x)&&!/user|file/.test(x))cnl.push(i)});st=1}
 const items=[];let skipped=0;
 for(const r of rows.slice(st)){
  let ph=(cp.length?cp.map(i=>r[i]||''):r.filter(isPh)).flatMap(x=>adig(x).split(/[\n\/;,،]+/)).map(x=>x.trim()).filter(isPh);
  if(!ph.length){skipped++;continue}
  const n=(cnl.length?cnl.map(i=>r[i]).filter(Boolean).join(' '):'')||r.find((x,i)=>x&&!isPh(x)&&i!=ct&&i!=cc)||'';
  const t=ct>=0?r[ct]:'',c=cc>=0?r[cc]:'';
  [...new Set(ph)].forEach(p=>items.push({n:n||p,t,p,c}))}
 return{items,skipped}}
function parseVCF(txt){
 const raw=txt.replace(/\r\n?/g,'\n').split('\n'),lines=[];
 for(let i=0;i<raw.length;i++){let l=raw[i];
  while(i+1<raw.length&&/^[ \t]/.test(raw[i+1])){l+=raw[i+1].slice(1);i++}
  if(/QUOTED-PRINTABLE/i.test(l)){while(/=$/.test(l)&&i+1<raw.length){l=l.slice(0,-1)+raw[i+1];i++}}
  lines.push(l)}
 const qp=s=>{const b=[];s.replace(/=([0-9A-Fa-f]{2})|([\s\S])/g,(m,h,c)=>{if(h)b.push(parseInt(h,16));else for(const x of new TextEncoder().encode(c))b.push(x);return''});return new TextDecoder().decode(new Uint8Array(b))};
 const cards=[];let cur=null;
 for(const l of lines){
  if(/^BEGIN:VCARD/i.test(l)){cur={fn:'',nn:'',tel:[],tt:'',org:''};continue}
  if(/^END:VCARD/i.test(l)){if(cur)cards.push(cur);cur=null;continue}
  if(!cur)continue;const k=l.indexOf(':');if(k<0)continue;
  const head=l.slice(0,k),key=head.split(';')[0].toUpperCase().replace(/^.*\./,'');
  let v=/QUOTED-PRINTABLE/i.test(head)?qp(l.slice(k+1)):l.slice(k+1);
  v=v.replace(/\\n/gi,' ').replace(/\\,/g,',').replace(/\\;/g,';').trim();
  if(key=='FN')cur.fn=v;
  else if(key=='N'){const p=v.split(';');cur.nn=[p[3],p[1],p[2],p[0]].filter(Boolean).join(' ').trim()}
  else if(key=='TEL')cur.tel.push(v.replace(/^tel:/i,'').trim());
  else if(key=='TITLE')cur.tt=v;
  else if(key=='ORG')cur.org=v.split(';').filter(Boolean).join(' - ')}
 const items=[];let skipped=0;
 for(const c of cards){const ph=[...new Set(c.tel.map(adig).filter(isPh))];if(!ph.length){skipped++;continue}
  const n=c.fn||c.nn,t=[c.tt,c.org].filter(Boolean).join(' — ');ph.forEach(p=>items.push({n:n||p,t,p,c:''}))}
 return{items,skipped}}
async function inflateRaw(u8){const ds=new DecompressionStream('deflate-raw'),w=ds.writable.getWriter();w.write(u8);w.close();return new Uint8Array(await new Response(ds.readable).arrayBuffer())}
async function unzip(buf){const u=new Uint8Array(buf),dv=new DataView(u.buffer,u.byteOffset,u.byteLength);let e=-1;
 for(let i=u.length-22;i>=Math.max(0,u.length-70000);i--)if(dv.getUint32(i,true)==0x06054b50){e=i;break}
 if(e<0)throw new Error('zip');const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const files={},td=new TextDecoder();
 for(let i=0;i<n;i++){const m=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
  files[td.decode(u.subarray(p+46,p+46+nl))]={m,cs,off};p+=46+nl+xl+cl}
 const get=async name=>{const f=files[name];if(!f)return null;const s=f.off+30+dv.getUint16(f.off+26,true)+dv.getUint16(f.off+28,true),d=u.subarray(s,s+f.cs);return td.decode(f.m==0?d:await inflateRaw(d))};
 return{get,names:Object.keys(files)}}
const xe=s=>s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&#(\d+);/g,(m,d)=>String.fromCharCode(d)).replace(/&amp;/g,'&');
const colN=r=>{let n=0;for(const ch of r.replace(/\d/g,''))n=n*26+ch.charCodeAt(0)-64;return n-1};
async function readXLSX(buf){const z=await unzip(buf),ss=[],sx=await z.get('xl/sharedStrings.xml');
 if(sx)for(const m of sx.matchAll(/<si[^>]*>([\s\S]*?)<\/si>/g))ss.push(xe([...m[1].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(x=>x[1]).join('')));
 const sheets=z.names.filter(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort((a,b)=>parseInt(a.match(/\d+/))-parseInt(b.match(/\d+/))),out=[];
 for(const sn of sheets){const x=await z.get(sn),rows=[];
  for(const rm of x.matchAll(/<row[^>]*>([\s\S]*?)<\/row>/g)){const row=[];
   for(const cm of rm[1].matchAll(/<c\s([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)){const at=cm[1],body=cm[2]||'',ref=(at.match(/\br="([A-Z]+\d+)"/)||[])[1],t=(at.match(/\bt="(\w+)"/)||[])[1];if(!ref)continue;let v='';
    if(t=='inlineStr')v=xe([...body.matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(y=>y[1]).join(''));
    else{const vm=body.match(/<v>([\s\S]*?)<\/v>/);if(vm){v=t=='s'?(ss[+vm[1]]||''):xe(vm[1]);if((!t||t=='n')&&/e/i.test(v)){const num=Number(v);if(isFinite(num)&&Math.abs(num)<1e15)v=String(Math.round(num))}}}
    row[colN(ref)]=v}
   rows.push(Array.from(row,x=>x==null?'':x))}
  out.push(rows)}
 return out}

 if(edit===undefined){b.innerHTML=`<button class="pr" id="tnw" style="margin-top:12px">＋ قالب جديد</button>${WA.tpls.length?WA.tpls.map(t=>`<div class="cm" data-tp="${t.id}"><div class="cmh"><b>${esc(t.name)}</b><span class="tt">✏️ تعديل</span></div><div class="tpv">${esc(t.body)}</div></div>`).join(''):'<div class="emp">لا توجد قوالب بعد.<br>القالب نص جاهز تعيد استخدامه في كل حملة، ويدعم متغيّرات مثل {الاسم}.</div>'}`;
  $('tnw').onclick=()=>wTpl(null);b.querySelectorAll('[data-tp]').forEach(e=>e.onclick=()=>wTpl(WA.tpls.find(x=>x.id==e.dataset.tp)));return}
 const t=edit||{id:0,name:'',body:''},smp=C.find(x=>x.n)||{n:'أحمد علي',t:'مدير مكتب',c:''};
 b.innerHTML=`<label>اسم القالب</label><input class="f" id="tn" value="${esc(t.name)}" placeholder="مثال: دعوة رسمية">
<label>نص القالب</label><textarea class="f" id="tb" rows="6" placeholder="السلام عليكم {الاسم}، يسرّنا دعوتكم…">${esc(t.body)}</textarea>
<div class="vars">${VARS.map(([k,l])=>`<button type="button" data-v="${k}">＋ ${l}</button>`).join('')}</div>
<label>معاينة</label><div class="chat"><div class="bub" id="tv"></div></div>
<button class="pr" id="tsv">${t.id?'حفظ التعديلات':'حفظ القالب'}</button>${t.id?'<button class="pr dg" id="tdl">حذف القالب</button>':''}<button class="b wf" id="tbk">رجوع</button>`;
 const pv=()=>$('tv').textContent=trender($('tb').value||'…',smp);pv();$('tb').oninput=pv;
 b.querySelectorAll('[data-v]').forEach(x=>x.onclick=()=>insTxt($('tb'),'{'+x.dataset.v+'}'));
 $('tbk').onclick=()=>wTpl();
 $('tsv').onclick=async()=>{const name=$('tn').value.trim(),body=$('tb').value.trim();if(!name||!body)return toast(WERR.fields);const r=await(t.id?api('PUT','tpl/'+t.id,{name,body}):api('POST','tpl',{name,body}));if(r.status!=200)return wfail(r);await wreload();wTpl();toast('تم الحفظ')};
 if(t.id)$('tdl').onclick=async()=>{if(!$('tdl').dataset.s){$('tdl').dataset.s=1;$('tdl').textContent='اضغط مرة أخرى للتأكيد';return}await api('DELETE','tpl/'+t.id);await wreload();wTpl();toast('تم الحذف')}}
// ---------- الربط
function wApi(){const b=$('wb'),c=WA.cfg;let pv=c.provider;
 const HINT={ultramsg:'أنشئ Instance في <b>ultramsg.com</b> وامسح رمز QR من واتساب، ثم انسخ <b>Instance ID</b> و<b>Token</b> إلى الحقول أدناه.',meta:'من <b>Meta for Developers ← WhatsApp ← API Setup</b> انسخ <b>Phone Number ID</b> وAccess Token. تنبيه: الرسائل النصية الحرة لا تصل إلا لمن راسلك خلال آخر 24 ساعة؛ للتواصل الأول يلزم قالب معتمد من Meta.',wpsender:'من لوحة <b>WP Sender ← مفاتيح الربط</b> انسخ <b>BASE API URL</b> و<b>API Key</b> (الذي يبدأ بـ <b dir="ltr">wps_</b>) إلى الحقلين أدناه.',custom:'يُرسل الخادم طلب POST إلى رابطك. استخدم <b dir="ltr">{{phone}}</b> و<b dir="ltr">{{message}}</b> و<b dir="ltr">{{token}}</b> داخل الرابط أو الترويسات أو الجسم.'};
 const hook=location.origin+'/api/wa-hook/'+WA.secret;
 b.innerHTML=`<div class="note" id="a_h"></div>
<label>مزوّد الخدمة</label><div class="seg" id="a_pv">${[['wpsender','WP Sender'],['ultramsg','UltraMsg'],['meta','Meta Cloud API'],['custom','API مخصّص']].map(([k,l])=>`<button data-p="${k}" class="${pv==k?'on':''}">${l}</button>`).join('')}</div>
<div data-w="wpsender ultramsg custom"><label id="a_ul">رابط الخدمة (اتركه فارغًا للافتراضي)</label><input class="f" id="a_url" dir="ltr" value="${esc(c.url)}" placeholder="https://api.ultramsg.com"></div>
<div data-w="ultramsg"><label>Instance ID</label><input class="f" id="a_in" dir="ltr" value="${esc(c.instance)}" placeholder="instance12345" autocomplete="off"></div>
<div data-w="meta"><label>Phone Number ID</label><input class="f" id="a_ph" dir="ltr" value="${esc(c.phone_id)}" placeholder="1098765432101234" autocomplete="off"></div>
<div data-w="wpsender ultramsg meta custom"><label id="a_tl">Token / Access Token ${c.hasToken?'<span class="pill ok">محفوظ</span>':''}</label><input class="f" id="a_tk" type="password" dir="ltr" autocomplete="new-password" placeholder="${c.hasToken?'•••••••• اتركه فارغًا للإبقاء على المحفوظ':'الصق الـ Token هنا'}"></div>
<div data-w="custom"><label>الترويسات (سطر لكل ترويسة)</label><textarea class="f" id="a_hd" rows="2" dir="ltr" placeholder="Authorization: Bearer {{token}}">${esc(c.hdr)}</textarea><label>جسم الطلب (JSON)</label><textarea class="f" id="a_bd" rows="3" dir="ltr" placeholder='{"to":"{{phone}}","message":"{{message}}"}'>${esc(c.body)}</textarea></div>
<div class="two"><div><label>الانتظار الافتراضي (ث)</label><input class="f" id="a_dl" type="number" min="5" dir="ltr" value="${c.delay}"></div><div><label>تذبذب عشوائي ٪</label><input class="f" id="a_jt" type="number" min="0" max="80" dir="ltr" value="${c.jit}"></div></div>
<div class="tt">الانتظار والتذبذب يجعلان الإرسال أقرب للسلوك البشري ويقلّلان خطر الحظر. يُنصح بـ 15 ثانية فأكثر.</div>
<button class="pr" id="a_sv">💾 حفظ إعدادات الربط</button>
<div class="sec"></div><label>اختبار الإرسال</label>
<input class="f" id="a_tn" dir="ltr" inputmode="tel" placeholder="رقمك: 07XX XXX XXXX"><input class="f" id="a_tm" style="margin-top:8px" value="رسالة تجريبية من دليل الأرقام ✅">
<button class="b wf" id="a_ts">📤 إرسال رسالة تجريبية</button><div id="a_tr" class="tt" style="margin-top:8px"></div>
<div class="sec"></div><label>Webhook لحالة التسليم (اختياري)</label>
<div class="kv"><input class="f" id="a_hk" readonly value="${esc(hook)}"><button class="b" id="a_cp">نسخ</button></div>
<div class="tt" style="margin-top:8px;line-height:1.8">ضع هذا الرابط في إعدادات Webhook لدى المزوّد لتظهر لك أرقام «وصلت» و«قُرئت» فعليًا. في Meta استخدم الرمز <b dir="ltr">${esc(WA.secret)}</b> كـ Verify Token. بدونه يُحسب النجاح عند قبول المزوّد للرسالة.</div>`;
 const show=()=>{$('a_h').innerHTML=HINT[pv];b.querySelectorAll('[data-w]').forEach(e=>e.hidden=!e.dataset.w.split(' ').includes(pv));$('a_ul').textContent=pv=='wpsender'?'BASE API URL':pv=='custom'?'رابط الـ API (POST)':'رابط الخدمة (اتركه فارغًا للافتراضي)';$('a_url').placeholder=pv=='wpsender'?'https://backendapi.wpsenderx.com/api':pv=='custom'?'https://example.com/send?to={{phone}}':'https://api.ultramsg.com';const tl=$('a_tl'),sv=tl.querySelector('.pill');tl.firstChild.textContent=pv=='wpsender'?'API Key (X-API-Key) ':'Token / Access Token ';if(sv)tl.appendChild(sv);};show();
 $('a_pv').querySelectorAll('button').forEach(x=>x.onclick=()=>{pv=x.dataset.p;$('a_pv').querySelectorAll('button').forEach(y=>y.classList.toggle('on',y==x));show()});
 $('a_cp').onclick=()=>{(navigator.clipboard?navigator.clipboard.writeText($('a_hk').value):Promise.reject()).then(()=>toast('تم نسخ الرابط'),()=>{$('a_hk').select();toast('حدّد الرابط وانسخه')})};
 $('a_sv').onclick=async()=>{const q={provider:pv,url:$('a_url').value.trim(),instance:$('a_in').value.trim(),phone_id:$('a_ph').value.trim(),hdr:$('a_hd').value,body:$('a_bd').value,delay:+$('a_dl').value||20,jit:+$('a_jt').value||0};const tk=$('a_tk').value.trim();if(tk)q.token=tk;
  if(pv=='meta')q.url='';const bt=$('a_sv');bt.disabled=true;const r=await api('PUT','wa/cfg',q);bt.disabled=false;if(r.status!=200)return wfail(r);WA.cfg=r.j.cfg;WD.d=0;toast(wready(WA.cfg)?'تم الحفظ — الربط جاهز ✅':'تم الحفظ، لكن البيانات ناقصة');wApi()};
 $('a_ts').onclick=async()=>{if(!wready(WA.cfg))return $('a_tr').innerHTML='<span class="er-t">احفظ إعدادات الربط أولًا.</span>';const bt=$('a_ts');bt.disabled=true;$('a_tr').textContent='جارٍ الإرسال…';const r=await api('POST','wa/test',{to:$('a_tn').value,msg:$('a_tm').value});bt.disabled=false;
  $('a_tr').innerHTML=r.status!=200?`<span class="er-t">${esc(WERR[r.j.err]||'تعذّر الاتصال بالخادم')}</span>`:r.j.ok?'<span class="ok-t">✅ قبل المزوّد الرسالة — تحقق من وصولها على واتساب.</span>':`<span class="er-t">❌ فشل: ${esc(r.j.e||'خطأ غير معروف')}</span>`}}
// ---------- شريط الحملة الجارية في الصفحة الرئيسية
let WRUN=0;
async function waRun(){const r=await api('GET','wa/run');if(r.status!=200)return;const x=r.j.run,b=$('bnr');if(!b)return;
 if(!x){b.innerHTML='';if(WRUN){WRUN=0;toast('اكتملت الحملة ✅ — افتح مركز واتساب لرؤية النتيجة')}return}
 WRUN=x.id;const ok=x.s+x.d+x.r,pc=Math.round((ok+x.f)/x.total*100);
 b.innerHTML=`<div class="bn run"><div><b>📤 «${esc(x.name)}» قيد الإرسال</b> <span class="tt">${ok+x.f} / ${x.total} · ✔ ${ok} · ✖ ${x.f}</span><div class="pbar on"><i style="width:${pc}%"></i></div></div><button id="bnb">متابعة</button></div>`;$('bnb').onclick=()=>waCamp(x.id)}

// ---- data sync
function load(d){ME={role:d.role,name:d.name,u:d.u};ADMIN=d.role=='admin';C=d.contacts;ORD=d.ord||[];FAV=new Set(d.fav||[]);HC=d.hc||[];MAXU=d.max||MAXU;REM=!!d.rem;curV=d.v}
function applyOps(ops){for(const o of ops){const k=C.findIndex(x=>x.i==o.id);if(o.c){if(k>=0)C[k]=o.c;else C.unshift(o.c)}else if(k>=0)C.splice(k,1)}}
async function sync(full){if(syncing&&!full)return;syncing=true;try{const r=await api('GET','data'+(full?'':'?since='+curV));if(r.status!=200)return;const d=r.j;if(d.same)return;if(d.delta){applyOps(d.ops);curV=d.v}else load(d);buildChips();render()}finally{syncing=false}}
function connect(){try{if(es)es.close();es=new EventSource('/api/events');es.onmessage=e=>{try{if(JSON.parse(e.data).v>curV)sync()}catch(_){}};es.addEventListener('kick',()=>kicked())}catch(e){}clearInterval(pollT);pollT=setInterval(sync,20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()})}
function start(d){load(d);try{Object.assign(S,JSON.parse(localStorage.getItem('pb_s2')||'{}'))}catch(e){}
 $('lg').hidden=true;$('app').hidden=false;$('add').hidden=!ADMIN;theme();buildChips();render();bump();connect();if(ADMIN){waRun();setInterval(waRun,6000)}
 $('gear').onclick=settings;$('out').onclick=()=>logout();$('add').onclick=()=>form();$('q').oninput=()=>{LIMIT=150;render()};
 ['click','keydown','touchstart','scroll'].forEach(e=>addEventListener(e,bump,{passive:true}))}
async function doLogin(){const u=$('lu').value.trim(),p=$('lp').value,k=$('lk').value,er=$('le'),b=$('go');er.textContent='';
 if(!u||!p||!k){er.textContent='أدخل اسم المستخدم وكلمة المرور والرمز';return}
 b.disabled=true;b.textContent='جارٍ التحقق…';
 try{const r=await api('POST','login',{u,p,k,dev:DEV,remember:$('lr').checked});
  if(r.status==200){const d=await api('GET','data');if(d.status==200){$('lp').value='';$('lk').value='';return start(d.j)}er.textContent='تعذّر تحميل البيانات (رمز '+d.status+')'}
  else if(r.status==409)er.textContent='هنالك جهاز آخر مسجّل دخول بنفس المعلومات. اطلب من المدير فك الارتباط ثم أعد المحاولة.';
  else if(r.status==429)er.textContent='محاولات كثيرة. انتظر '+(r.j.wait||60)+' ثانية.';
  else if(r.status==401)er.textContent='بيانات الدخول غير صحيحة';
  else er.textContent='تعذّر الاتصال بالخادم. حاول لاحقًا.'}
 finally{b.disabled=false;b.textContent='دخول'}}
$('go').onclick=doLogin;['lu','lp','lk'].forEach(i=>$(i).addEventListener('keydown',e=>{if(e.key=='Enter')doLogin()}));
(async()=>{theme();const d=await api('GET','data');BOOT=false;if(d.status==200)return start(d.j);try{const m=sessionStorage.getItem('pb_msg');if(m){$('le').textContent=m;sessionStorage.removeItem('pb_msg')}}catch(e){}$('lg').hidden=false})();

</script></body></html>
